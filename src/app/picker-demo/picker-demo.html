<section class="demo">
  <header class="demo__header">
    <p class="demo__pkg">{{ packageName() }}</p>
    <h2>{{ title() }}</h2>
    <p class="demo__desc">{{ description() }}</p>
  </header>

  <label class="demo__output">
    <span>Selected emojis</span>
    <textarea
      [value]="text()"
      (input)="text.set($any($event.target).value)"
      rows="3"
      placeholder="Click an emoji below…"
    ></textarea>
  </label>

  <div class="demo__picker">
    <ng-content />
  </div>
</section>
