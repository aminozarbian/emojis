<div class="shell">
  <header class="topbar">
    <nav class="tabs" aria-label="Picker libraries">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  </header>
  <main class="main">
    <router-outlet />
  </main>
</div>
